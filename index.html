<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"/>
  <!-- Sicherheit: Skripte nur aus eigenen Dateien (keine Inline-Handler, kein fremdes CDN);
       Daten fließen nur zu Anmeldung, Graph und SharePoint. Mail-Inhalte werden zusätzlich
       über eine Positivliste bereinigt (js/html.js). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com https://*.sharepoint.com; frame-src 'self' https://login.microsoftonline.com; object-src 'none'; base-uri 'self'; form-action 'self'"/>
  <meta name="referrer" content="strict-origin-when-cross-origin"/>
  <title>DIHAG · Tickets</title>
  <link rel="icon" type="image/png" href="assets/dihag-zeichen.png"/>
  <!-- Clickjacking-Schutz: unsichtbar, bis js/rahmenschutz.js bestätigt, dass die Seite oben steht. -->
  <style id="rahmenschutz">body { display: none !important; }</style>
  <!-- Vorladen: Die Sicherheitsrichtlinie oben schaltet in Chrome das vorausschauende Laden ab.
       Ohne diese Hinweise holt der Browser die Skripte am Seitenende einzeln nacheinander.
       Jede Adresse steht hier aufs Zeichen so wie im Tag weiter unten. -->
  <link rel="preload" as="style" href="css/app.css?v=1"/>
  <link rel="preload" as="script" href="js/rahmenschutz.js?v=1"/>
  <link rel="preload" as="script" href="vendor/msal-browser/5.23.0/msal-redirect-bridge.min.js"/>
  <link rel="preload" as="script" href="js/anmeldeantwort.js?v=1"/>
  <link rel="preload" as="script" href="vendor/msal-browser/5.23.0/msal-browser.min.js"/>
  <link rel="modulepreload" href="js/app.js?v=1"/>
  <link rel="modulepreload" href="js/ansicht-berichte.js"/>
  <link rel="modulepreload" href="js/ansicht-liste.js"/>
  <link rel="modulepreload" href="js/ansicht-neu.js"/>
  <link rel="modulepreload" href="js/ansicht-ticket.js"/>
  <link rel="modulepreload" href="js/ansicht-verwaltung.js"/>
  <link rel="modulepreload" href="js/api.js"/>
  <link rel="modulepreload" href="js/auth.js"/>
  <link rel="modulepreload" href="js/config.js"/>
  <link rel="modulepreload" href="js/daten.js"/>
  <link rel="modulepreload" href="js/einrichtung.js"/>
  <link rel="modulepreload" href="js/html.js"/>
  <link rel="modulepreload" href="js/kopie.js"/>

  <link rel="modulepreload" href="js/modell.js"/>
  <link rel="modulepreload" href="js/personenwahl.js"/>
  <link rel="modulepreload" href="js/text.js"/>
  <link rel="modulepreload" href="js/ui.js"/>
  <script src="js/rahmenschutz.js?v=1"></script>
  <!-- MSAL selbst ausgeliefert (npm @azure/msal-browser 5.23.0). Diese Seite ist zugleich die
       Redirect-URI der Anmeldung: js/anmeldeantwort.js reicht Antworten aus Anmelde-iframes
       über die Redirect-Bridge an die App weiter. -->
  <script src="vendor/msal-browser/5.23.0/msal-redirect-bridge.min.js"></script>
  <script src="js/anmeldeantwort.js?v=1"></script>
  <script src="vendor/msal-browser/5.23.0/msal-browser.min.js"></script>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/exo-latin.woff2" crossorigin/>

  <script type="module" src="js/app.js?v=1"></script>
</head>
<body>
<a href="#hauptinhalt" class="skip-link">Zum Inhalt springen</a>

<div id="boot">
  <img src="assets/dihag-zeichen.png" alt="" width="52" height="58"/>
  <div class="boot-titel">DIHAG Tickets</div>
  <div class="boot-text" id="boot-text">Anmeldung läuft …</div>
  <div class="spinner" id="boot-spinner"></div>
  <div class="boot-fehler" id="boot-fehler" hidden></div>
  <button class="knopf primaer" id="boot-knopf" data-aktion="neu-laden" hidden>Erneut versuchen</button>
</div>

<div id="app" hidden>
  <header class="kopf">
    <a class="marke" href="#/">
      <img src="assets/dihag-zeichen.png" alt="DIHAG" width="26" height="29"/>
      <span>Tickets</span>
    </a>
    <nav id="navigation" class="navigation" aria-label="Hauptnavigation"></nav>
    <div class="kopf-rechts">
      <a class="knopf primaer" href="#/neu">＋ Neues Ticket</a>
      <button class="nutzer" id="nutzer" data-aktion="nutzermenue" aria-haspopup="menu" title="Konto"></button>
    </div>
  </header>
  <main id="hauptinhalt" tabindex="-1"></main>
</div>

<div id="meldungen" aria-live="polite"></div>
</body>
</html>
