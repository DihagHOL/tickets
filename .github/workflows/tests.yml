# Tests und Veröffentlichung.
#
# Tests: Modell, statische Modulprüfung, Flow-Paket (Struktur + Ausdrücke), Nachtlauf-Probelauf
# und die Verdrahtung der Seite (tests/seite.test.mjs). Ohne Abhängigkeiten, ohne Tenant.
# Der Browser-Rundgang (e2e/rundgang.mjs) läuft lokal.
#
# Veröffentlichung: nur für main und nur nach grünen Tests. Ein roter Test hält sie auf, die
# Seite bleibt dann auf dem letzten guten Stand. Hochgeladen werden allein die Dateien der
# Seite samt alter App (alt/) und Flow-Paket (flow/). Doku, Tests und Skripte bleiben im
# Repository. Bis zum 16.11.2026 lief hier die Jekyll-Vorlage und veröffentlichte alles.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch: {}   # manueller Lauf über den Actions-Tab, veröffentlicht main neu

# Nur lesen: Der Lauf braucht keine Schreibrechte am Repository.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0 – auf den Commit festgelegt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: 22
      - name: Testsuiten
        run: node scripts/test.mjs

  veroeffentlichen:
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Nur dieser Job darf veröffentlichen, und nur das.
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read   # nur zum Nachsehen, ob das Paket schon gelistet ist (Schritt „Warten …“)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    # Zwei Pushes kurz nacheinander: nacheinander veröffentlichen, keinen Lauf abbrechen.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      # Ohne das lädt ein Browser nach einer Änderung weiter die alten Dateien.
      - name: "Versionsparameter ?v=… auf den Commit setzen"
        run: |
          SHA="${GITHUB_SHA::8}"
          sed -i -E "s/\?v=[A-Za-z0-9._-]+/?v=$SHA/g" index.html

      # Nur was die Seite braucht. Alles andere bleibt im Repository.
      - name: Dateien der Seite zusammenstellen
        run: |
          mkdir _site
          cp -r index.html assets css js vendor alt flow _site/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: _site

      # GitHub listet das hochgeladene Paket manchmal erst Sekunden später. deploy-pages fragt
      # sofort danach und bricht dann mit „No artifacts named github-pages“ ab (in der
      # Bedarfsanfrage am 25.11.2026 dreimal, das Paket war jeweils eine Sekunde später da).
      # Darum erst warten, bis es da ist.
      - name: Warten, bis das Paket gelistet ist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "${n:-0}" -ge 1 ]; then echo "Paket gelistet (Versuch $i)"; sleep 3; exit 0; fi
            sleep 2
          done
          echo "::warning::Paket nach 60 Sekunden noch nicht gelistet, Veröffentlichen wird trotzdem versucht"

      - name: Veröffentlichen
        id: deployment
        continue-on-error: true   # zweiter Versuch weiter unten
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1

      # deploy-pages sieht das Paket manchmal auch nach dem Warten noch nicht (25.11.2026 in
      # e-rechnung). Dann nach einer halben Minute ein zweiter Versuch. Scheitert auch der, ist der Lauf rot.
      - name: Vor dem zweiten Versuch warten
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Veröffentlichen, zweiter Versuch
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
